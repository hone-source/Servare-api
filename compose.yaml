services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-servare}:${POSTGRES_PASSWORD:-servare}@db:5432/${POSTGRES_DB:-servare}
      # Certificados de desarrollo generados con mkcert en ./certs
      TLS_CERT: /certs/dev.pem
      TLS_KEY: /certs/dev-key.pem
    volumes:
      - ./certs:/certs:ro
    restart: unless-stopped
    develop:
      watch:
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: deno.json
        - action: rebuild
          path: deno.lock

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-servare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-servare}
      POSTGRES_DB: ${POSTGRES_DB:-servare}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      # Esquema inicial: Postgres solo ejecuta estos scripts cuando el volumen está vacío
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  db-data:
